spring.application.name=workmanager

#// ket noi voi mysql
spring.datasource.url=jdbc:mysql://localhost:3306/work_management?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=8080

# JWT Configuration
jwt.secret=workmanager-secret-key-for-jwt-token-generation
jwt.expiration=86400000

# Logging Configuration
logging.level.com.example.workmanager=DEBUG
logging.level.org.springframework.security=DEBUG

logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG




